name: brew pr-pull

on:
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Exact tested pull request head commit SHA
        required: true
        type: string

concurrency:
  group: brew-pr-pull
  cancel-in-progress: false

permissions: {}

jobs:
  validate-automatic:
    name: validate automatic publication
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact_id }}
      head_sha: ${{ steps.evidence.outputs.head_sha }}
      pull_request: ${{ steps.evidence.outputs.pull_request }}
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Collect and validate publication evidence
        id: evidence
        env:
          EXPECTED_BOT: ${{ vars.RELEASE_BOT_LOGIN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ -z "$EXPECTED_BOT" ]]; then
            echo "RELEASE_BOT_LOGIN is not configured" >&2
            exit 1
          fi
          evidence="$RUNNER_TEMP/publish-evidence.json"
          script/collect-publish-evidence --run-id "$RUN_ID" >"$evidence"
          script/validate-publish \
            --evidence "$evidence" \
            --expected-bot "$EXPECTED_BOT"
          {
            echo "artifact_id=$(jq -r '.workflow.artifact.id' "$evidence")"
            echo "head_sha=$(jq -r '.pr.head_sha' "$evidence")"
            echo "pull_request=$(jq -r '.pr.number' "$evidence")"
          } >>"$GITHUB_OUTPUT"

  publish-automatic:
    name: publish trusted bottle
    needs: validate-automatic
    if: needs.validate-automatic.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Check out trusted publisher
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate publication evidence
        id: evidence
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.validate-automatic.outputs.artifact_id }}
          EXPECTED_BOT: ${{ vars.RELEASE_BOT_LOGIN }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-automatic.outputs.head_sha }}
          EXPECTED_PULL_REQUEST: ${{ needs.validate-automatic.outputs.pull_request }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          evidence="$RUNNER_TEMP/publish-evidence.json"
          script/collect-publish-evidence --run-id "$RUN_ID" >"$evidence"
          script/validate-publish \
            --evidence "$evidence" \
            --expected-bot "$EXPECTED_BOT"
          artifact_id="$(jq -r '.workflow.artifact.id' "$evidence")"
          head_sha="$(jq -r '.pr.head_sha' "$evidence")"
          pull_request="$(jq -r '.pr.number' "$evidence")"
          if [[ "$artifact_id" != "$EXPECTED_ARTIFACT_ID" || \
                "$head_sha" != "$EXPECTED_HEAD_SHA" || \
                "$pull_request" != "$EXPECTED_PULL_REQUEST" ]]; then
            echo "publication evidence changed between validation jobs" >&2
            exit 1
          fi
          {
            echo "artifact_id=$artifact_id"
            echo "head_sha=$head_sha"
            echo "pull_request=$pull_request"
          } >>"$GITHUB_OUTPUT"

      - name: Download exact-run bottle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/exact-run-bottles
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Pull bottles without publishing
        id: pr-pull
        env:
          HEAD_SHA: ${{ steps.evidence.outputs.head_sha }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ steps.evidence.outputs.pull_request }}
        run: |
          brew pr-pull --debug --no-upload --retain-bottle-dir \
            --artifact-pattern=bottles_macos-15-arm64 \
            --tap="$GITHUB_REPOSITORY" \
            --head-sha="$HEAD_SHA" "$PULL_REQUEST"

      - name: Compare exact-run and selected bottles
        env:
          BOTTLE_PATH: ${{ steps.pr-pull.outputs.bottle_path }}
        run: |
          script/compare-bottle-artifacts \
            --expected "$RUNNER_TEMP/exact-run-bottles" \
            --actual "$BOTTLE_PATH"

      - name: Revalidate immediately before publication
        env:
          EXPECTED_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact_id }}
          EXPECTED_BOT: ${{ vars.RELEASE_BOT_LOGIN }}
          EXPECTED_HEAD_SHA: ${{ steps.evidence.outputs.head_sha }}
          EXPECTED_PULL_REQUEST: ${{ steps.evidence.outputs.pull_request }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          evidence="$RUNNER_TEMP/final-publish-evidence.json"
          script/collect-publish-evidence --run-id "$RUN_ID" >"$evidence"
          script/validate-publish \
            --evidence "$evidence" \
            --expected-bot "$EXPECTED_BOT"
          test "$(jq -r '.workflow.artifact.id' "$evidence")" = \
            "$EXPECTED_ARTIFACT_ID"
          test "$(jq -r '.pr.head_sha' "$evidence")" = \
            "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.pr.number' "$evidence")" = \
            "$EXPECTED_PULL_REQUEST"

      - name: Publish validated bottles
        env:
          BOTTLE_PATH: ${{ steps.pr-pull.outputs.bottle_path }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$BOTTLE_PATH"
          brew pr-upload --debug

      - name: Push commits
        uses: Homebrew/actions/git-try-push@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          branch: main

  manual-pr-pull:
    name: manually publish bottle
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "head_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          brew pr-pull --debug --tap="$GITHUB_REPOSITORY" \
            --head-sha="$HEAD_SHA" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          branch: main
