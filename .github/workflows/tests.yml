name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  automation-tests:
    name: automation tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check Ruby syntax
        run: |
          ruby -c lib/homebrew_tap/automation.rb
          ruby -c script/update-formula
          ruby -c script/validate-publish
          for test_file in test/*_test.rb; do
            ruby -c "$test_file"
          done

      - name: Run automation tests
        run: |
          for test_file in test/*_test.rb; do
            ruby -Itest "$test_file"
          done

      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  test-bot-macos:
    name: brew test-bot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect source formulae
        id: source-formulae
        shell: bash
        env:
          TAP_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          present=false
          if compgen -G "$TAP_PATH/Formula/*.rb" >/dev/null; then
            present=true
          fi
          printf 'present=%s\n' "$present" >>"$GITHUB_OUTPUT"

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
        if: steps.source-formulae.outputs.present == 'true'

      - name: Build formulae
        if: >-
          github.event_name == 'pull_request' &&
          steps.source-formulae.outputs.present == 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_ARCH" == "X64" ]]; then
            # Intel Sequoia has no current Go bottle, so bootstrap it in the
            # same test-bot run while marking only the tap formulae as added.
            tap_formulae="jimeh/tap/airplan,jimeh/tap/macos-battery-exporter"
            brew test-bot --only-formulae \
              --testing-formulae="go,$tap_formulae" \
              --added-formulae="$tap_formulae"
            rm -f go--*.bottle.*
          else
            brew test-bot --only-formulae
          fi

      - name: Verify expected bottles
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          steps.source-formulae.outputs.present == 'true'
        shell: bash
        run: |
          count=0
          for bottle in ./*.bottle.json; do
            if [[ -e "$bottle" ]]; then
              count=$((count + 1))
            fi
          done

          if [[ "$count" -ne 2 ]]; then
            printf 'Expected 2 bottle JSON files, found %d.\n' "$count" >&2
            ls -1 ./*.bottle.* 2>/dev/null || true
            exit 1
          fi

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: ignore

  test-bot-linux:
    name: brew test-bot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect source formulae
        id: source-formulae
        shell: bash
        env:
          TAP_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          present=false
          if compgen -G "$TAP_PATH/Formula/*.rb" >/dev/null; then
            present=true
          fi
          printf 'present=%s\n' "$present" >>"$GITHUB_OUTPUT"

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
        if: steps.source-formulae.outputs.present == 'true'

      - run: brew test-bot --only-formulae
        if: >-
          github.event_name == 'pull_request' &&
          steps.source-formulae.outputs.present == 'true'

      - name: Verify expected bottles
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          steps.source-formulae.outputs.present == 'true'
        shell: bash
        run: |
          count=0
          for bottle in ./*.bottle.json; do
            if [[ -e "$bottle" ]]; then
              count=$((count + 1))
            fi
          done

          if [[ "$count" -ne 1 ]]; then
            printf 'Expected 1 bottle JSON file, found %d.\n' "$count" >&2
            ls -1 ./*.bottle.* 2>/dev/null || true
            exit 1
          fi

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: ignore
