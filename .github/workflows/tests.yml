name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  automation-tests:
    name: automation tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Ruby syntax
        run: |
          ruby -c lib/homebrew_tap/automation.rb
          ruby -c script/update-formula
          ruby -c script/validate-publish
          for test_file in test/*_test.rb; do
            ruby -c "$test_file"
          done

      - name: Run automation tests
        run: |
          for test_file in test/*_test.rb; do
            ruby -Itest "$test_file"
          done

      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  test-bot-macos:
    name: brew test-bot (macos-15-arm64)
    runs-on: macos-15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Homebrew target
        run: |
          architecture="$(
            brew ruby -rrbconfig -e \
              'print RbConfig::CONFIG.fetch("host_cpu")'
          )"
          if [[ "$architecture" != "arm64" ]]; then
            printf 'Expected arm64 Homebrew, found %s.\n' \
              "$architecture" >&2
            exit 1
          fi

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-15-arm64-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-15-arm64-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax --stable

      - name: Detect changed formulae
        id: formulae
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae-detect

      - name: Build formulae
        if: github.event_name == 'pull_request'
        env:
          ADDED_FORMULAE: ${{ steps.formulae.outputs.added_formulae }}
          DELETED_FORMULAE: ${{ steps.formulae.outputs.deleted_formulae }}
          TESTING_FORMULAE: ${{ steps.formulae.outputs.testing_formulae }}
        run: |
          if [[ -z "$TESTING_FORMULAE" && -z "$DELETED_FORMULAE" ]]; then
            exit 0
          fi

          brew test-bot --only-formulae \
            "--testing-formulae=$TESTING_FORMULAE" \
            "--added-formulae=$ADDED_FORMULAE" \
            "--deleted-formulae=$DELETED_FORMULAE"

      - name: Verify expected bottles
        if: always() && github.event_name == 'pull_request'
        env:
          TESTING_FORMULAE: ${{ steps.formulae.outputs.testing_formulae }}
        run: |
          expected=0
          IFS=',' read -r -a formulae <<< "$TESTING_FORMULAE"
          for formula in "${formulae[@]}"; do
            case "$formula" in
              macos-battery-exporter|jimeh/tap/macos-battery-exporter)
                expected=1
                ;;
              "")
                ;;
              *)
                printf 'Unexpected formula selected for bottles: %s.\n' \
                  "$formula" >&2
                exit 1
                ;;
            esac
          done

          bottle_json=(./*.bottle.json)
          if [[ ! -e "${bottle_json[0]}" ]]; then
            bottle_json=()
          fi

          if [[ "${#bottle_json[@]}" -ne "$expected" ]]; then
            printf 'Expected %d bottle JSON files, found %d.\n' \
              "$expected" "${#bottle_json[@]}" >&2
            ls -1 ./*.bottle.* 2>/dev/null || true
            exit 1
          fi

          for bottle in "${bottle_json[@]}"; do
            if ! brew ruby -rjson -e '
              metadata = JSON.parse(File.read(ARGV.fetch(0))).values
              valid = metadata.length == 1 && metadata.all? do |item|
                item.dig("bottle", "tags")&.keys == ["arm64_sequoia"]
              end
              exit 1 unless valid
            ' "$bottle"; then
              printf 'Bottle %s must contain only arm64_sequoia.\n' \
                "$bottle" >&2
              exit 1
            fi
          done

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_macos-15-arm64
          path: '*.bottle.*'
          if-no-files-found: ignore
